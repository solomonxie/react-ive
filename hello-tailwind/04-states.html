<!doctype html>
<!--
  Lesson 04: States
  Goal: add interactive elements — buttons and form inputs — styled with
        hover:, focus:, and dark: variants. dark: follows the OS/browser
        color-scheme preference by default in Tailwind v4 (no config
        needed); try toggling your OS dark mode to see this page flip.
  Run:  make build
  Open: open 04-states.html
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>04 — States</title>
  <link rel="stylesheet" href="dist/output.css" />
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 min-h-screen">
  <header class="flex items-center justify-between bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-6 py-4">
    <span class="text-lg font-bold">Lesson 04</span>
    <nav class="flex gap-6 text-sm font-medium text-slate-600 dark:text-slate-300">
      <a href="#" class="text-sky-600 dark:text-sky-400">Dashboard</a>
      <a href="#" class="hover:text-slate-900 dark:hover:text-white">Projects</a>
      <a href="#" class="hover:text-slate-900 dark:hover:text-white">Settings</a>
    </nav>
  </header>

  <main class="mx-auto max-w-2xl px-6 py-12">
    <h1 class="text-2xl font-bold">Buttons &amp; form states</h1>
    <p class="mt-2 text-slate-600 dark:text-slate-400">
      Every interactive element below reacts to
      <code class="text-sky-700 dark:text-sky-400">hover:</code> and
      <code class="text-sky-700 dark:text-sky-400">focus:</code>, and the
      whole page adapts with
      <code class="text-sky-700 dark:text-sky-400">dark:</code>.
    </p>

    <!-- Buttons -->
    <section class="mt-8 flex flex-wrap gap-4">
      <button
        class="rounded-lg bg-sky-600 px-4 py-2 font-semibold text-white
               hover:bg-sky-700 active:bg-sky-800
               focus:outline-none focus:ring-2 focus:ring-sky-300 focus:ring-offset-2
               dark:focus:ring-offset-slate-900 transition-colors"
      >
        Primary
      </button>

      <button
        class="rounded-lg border border-slate-300 dark:border-slate-600 px-4 py-2 font-semibold
               text-slate-700 dark:text-slate-200
               hover:bg-slate-100 dark:hover:bg-slate-800
               focus:outline-none focus:ring-2 focus:ring-slate-300 focus:ring-offset-2
               dark:focus:ring-offset-slate-900 transition-colors"
      >
        Secondary
      </button>

      <button
        disabled
        class="rounded-lg bg-slate-200 dark:bg-slate-700 px-4 py-2 font-semibold
               text-slate-400 dark:text-slate-500 cursor-not-allowed"
      >
        Disabled
      </button>
    </section>

    <!-- Form -->
    <section class="mt-10 bg-white dark:bg-slate-800 rounded-lg border border-slate-200 dark:border-slate-700 p-6">
      <h2 class="text-lg font-semibold mb-4">Sign up</h2>

      <form class="flex flex-col gap-4">
        <label class="flex flex-col gap-1 text-sm font-medium text-slate-700 dark:text-slate-300">
          Email
          <input
            type="email"
            placeholder="you@example.com"
            class="rounded-md border border-slate-300 dark:border-slate-600
                   bg-white dark:bg-slate-900 px-3 py-2 text-slate-900 dark:text-slate-100
                   placeholder:text-slate-400
                   hover:border-slate-400 dark:hover:border-slate-500
                   focus:outline-none focus:ring-2 focus:ring-sky-400 focus:border-sky-400"
          />
        </label>

        <label class="flex flex-col gap-1 text-sm font-medium text-slate-700 dark:text-slate-300">
          Password
          <input
            type="password"
            placeholder="••••••••"
            class="rounded-md border border-slate-300 dark:border-slate-600
                   bg-white dark:bg-slate-900 px-3 py-2 text-slate-900 dark:text-slate-100
                   placeholder:text-slate-400
                   hover:border-slate-400 dark:hover:border-slate-500
                   focus:outline-none focus:ring-2 focus:ring-sky-400 focus:border-sky-400"
          />
        </label>

        <label class="flex items-center gap-2 text-sm text-slate-600 dark:text-slate-400">
          <input
            type="checkbox"
            class="h-4 w-4 rounded border-slate-300 dark:border-slate-600 text-sky-600
                   focus:ring-2 focus:ring-sky-400"
          />
          I agree to the terms
        </label>

        <button
          type="submit"
          class="mt-2 rounded-lg bg-sky-600 px-4 py-2 font-semibold text-white
                 hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-sky-300
                 focus:ring-offset-2 dark:focus:ring-offset-slate-800 transition-colors"
        >
          Create account
        </button>
      </form>
    </section>
  </main>
</body>
</html>
