<!doctype html>
<!--
  Hello World — loading htmx and issuing a first hx-get swap.
  Goal: see the smallest possible htmx request/response/swap cycle.
  Run:  cd hello-htmx && make dev
  Open: http://localhost:3000/01-hello-world.html
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>01 — Hello World</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; }
    #result { margin-top: 1rem; padding: 0.75rem; border: 1px solid #ccc; border-radius: 6px; min-height: 1.5rem; }
  </style>
</head>
<body>
  <p><a href="/">&larr; back to menu</a></p>
  <h1>01 — Hello World</h1>
  <p>
    Clicking the button below issues a <code>GET /api/greet</code> request.
    htmx swaps the returned HTML fragment straight into <code>#result</code> —
    no client-side JavaScript needed.
  </p>

  <button hx-get="/api/greet" hx-target="#result" hx-swap="innerHTML">
    Greet me
  </button>

  <div id="result">Waiting for a greeting&hellip;</div>
</body>
</html>
