# 04. When it runs, what it cancels, and what it's allowed to do
#
# - pull_request `types`: the default is opened, synchronize (new commits) and
#   reopened. Adding ready_for_review lets you skip drafts and still run
#   when the draft is marked ready.
# - workflow_dispatch adds a "Run workflow" button in the Actions tab, and
#   lets you start it from a terminal: gh workflow run <file> --ref <branch>
# - push to main: re-check what actually got merged.
# - concurrency: push three commits in a row and only the last run matters.
#   Runs in the same group cancel the older one.
# - permissions: the GITHUB_TOKEN every run gets can write to the repo by
#   default on older repos. Ask for only what the workflow needs.

name: 04 triggers, concurrency and permissions

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  # One group per workflow per branch (or per pull request).
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel old runs on branches, but never a run on the default branch
  # halfway through.
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

permissions:
  contents: read

jobs:
  check:
    # Skip draft pull requests. On push and workflow_dispatch there's no
    # pull_request in the event, so the second half is never checked.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: echo "Running for ${{ github.event_name }} on ${{ github.ref_name }}"
